<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/media/avatar.jpg" />

    <!-- Fallbacks; each route overrides these via the Seo component -->
    <title>DJ Skara Promotions — Amapiano &amp; Afro House DJ, South Africa</title>
    <meta
      name="description"
      content="DJ Skara Promotions — amapiano, afro house and party sets for weddings, clubs and corporate events across Mpumalanga and Gauteng."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- The hero portrait is the LCP element -->
    <link rel="preload" as="image" href="/media/skara-portrait.jpg" fetchpriority="high" />

    <!--
      Google AdSense loader. It must be static in the document head: the AdSense
      verification crawler fetches this HTML without running the app, so a
      runtime-injected tag would not be found and the site would fail review.
      Consent is handled by gating personalisation, not the script itself —
      see src/components/ads/AdSenseScript.tsx.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8487777891911418"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 4rem 1.5rem; font-family: system-ui; color: #f4f4f6">
        <h1>DJ Skara Promotions</h1>
        <p>
          This site needs JavaScript. For bookings, email
          <a style="color: #e3b34c" href="mailto:Kgolwazi@gmail.com">Kgolwazi@gmail.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
